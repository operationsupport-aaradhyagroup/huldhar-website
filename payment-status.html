<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Status | HULDHAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <style>
    body { background: #f6f8f5; }
    .payment-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .payment-card { width: min(520px, 100%); background: white; border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 40px; text-align: center; }
    .status-icon { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 22px; background: #fff4df; color: #b46a00; font-size: 34px; font-weight: 800; }
    .status-icon.success { background: #e8f7ed; color: #147a38; }
    .status-icon.failed { background: #fdeaea; color: #b42318; }
    .payment-card h1 { font-size: 28px; margin-bottom: 10px; }
    .payment-card p { color: var(--muted); line-height: 1.6; }
    .order-ref { background: #f7f8f7; border-radius: 10px; padding: 12px; margin: 22px 0; font-size: 13px; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="payment-shell">
    <section class="payment-card" aria-live="polite">
      <a href="index.html"><img src="images/haldhar-logo.svg" alt="HULDHAR" style="height:52px;margin-bottom:28px"></a>
      <div id="status-icon" class="status-icon">…</div>
      <h1 id="status-title">Verifying your payment</h1>
      <p id="status-message">Please wait while we securely confirm the result with PhonePe.</p>
      <div id="order-ref" class="order-ref"></div>
      <div class="actions">
        <a href="products.html" class="btn btn-primary">Back to Products</a>
        <button id="retry-status" type="button" class="btn btn-outline" style="cursor:pointer">Check Again</button>
      </div>
    </section>
  </main>
  <script src="js/payment-status.js"></script>
</body>
</html>
